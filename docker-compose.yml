services:
  postgres:
    image: postgres:16-alpine
    container_name: fintrack-postgres
    environment:
      POSTGRES_DB: app_financeiro
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
    ports:
      - "5432:5432"
    volumes:
      - fintrack-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: fintrack-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/app_financeiro
      DB_USERNAME: postgres
      DB_PASSWORD: 123456
      JWT_SECRET: minha-chave-secreta-super-longa-para-jwt-funcionar-com-hs256
    ports:
      - "8080:8080"

volumes:
  fintrack-data:
